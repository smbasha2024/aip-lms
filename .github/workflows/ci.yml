name: Phase 1 foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aip_lms_test
          POSTGRES_USER: aip_lms_test
          # Disposable runner only; never a deployment configuration.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aip_lms_test -d aip_lms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://aip_lms_dev@127.0.0.1:5432/aip_lms_dev
      TEST_DATABASE_URL: postgresql+psycopg://aip_lms_test@127.0.0.1:5432/aip_lms_test
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:13000"]'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:18000
      E2E_API_URL: http://127.0.0.1:18000
      E2E_BASE_URL: http://127.0.0.1:13000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Backend lint, formatting and tests
        working-directory: backend
        run: |
          .venv/bin/ruff check --config pyproject.toml . ../database/migrations/env.py
          .venv/bin/ruff format --config pyproject.toml --check . ../database/migrations/env.py
          .venv/bin/pytest --database
      - name: Alembic registry connection
        run: backend/.venv/bin/alembic -c database/alembic.ini current
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend gates
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Browser smoke gate
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
