# Disposable prospect demo only. No paid resources or real employee data.
# Review the deployment guide before applying this Blueprint.
services:
  - type: web
    name: aip-lms-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./deploy/render-demo.Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    numInstances: 1
    autoDeployTrigger: checksPass
    domains:
      - lms-api.aiproxybots.com
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_DATA_ACKNOWLEDGEMENT
        value: synthetic-only
      - key: DATABASE_URL
        fromDatabase:
          name: aip-lms-demo-db
          property: connectionString
      - key: ORG_TIMEZONE
        value: Asia/Kolkata
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://lms.aiproxybots.com"]'
      - key: SEED_EMPLOYEE_PASSWORD
        generateValue: true
      - key: SEED_MANAGER_PASSWORD
        generateValue: true
      - key: SEED_ADMINISTRATOR_PASSWORD
        generateValue: true

  - type: web
    name: aip-lms-web
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./deploy/frontend.Dockerfile
    dockerContext: .
    healthCheckPath: /login
    numInstances: 1
    autoDeployTrigger: checksPass
    domains:
      - lms.aiproxybots.com
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://lms-api.aiproxybots.com
      - key: NEXT_PUBLIC_APP_NAME
        value: Employee Leave Management Demo

databases:
  - name: aip-lms-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: aip_lms_demo
    user: aip_lms_demo
    ipAllowList: []
