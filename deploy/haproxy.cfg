global
    log stdout format raw local0
    nbthread 1
    tune.lua.bool-sample-conversion normal
    lua-load /usr/local/etc/haproxy/login_limit.lua

defaults
    mode http
    log global
    # Status/timing only: no request bodies, headers or query strings in logs.
    log-format "%ci %ST %B %Tt"
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend staging
    bind :8443 ssl crt /usr/local/etc/haproxy/localhost.pem ssl-min-ver TLSv1.2
    # Browser-provided forwarding metadata must never become the API client IP.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Host
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    acl login method POST
    acl login_path path,url_dec /api/v1/auth/login
    http-request lua.login-limit if login login_path
    acl api_path path_beg /api/v1/
    acl health_path path /health /health/ready
    acl api_docs path /docs /redoc /openapi.json
    use_backend api if api_path or health_path or api_docs
    default_backend web

backend api
    server api backend:8000 check resolvers docker init-addr libc,none

backend web
    server web frontend:3000 check resolvers docker init-addr libc,none
